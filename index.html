<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED 우리말 영단어 학습 앱</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --subtext: #6b7280;
            --correct: #10b981;
            --wrong: #ef4444;
            --accent: #8b5cf6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.35rem;
            margin: 0 0 16px 0;
            font-weight: 800;
        }

        /* 시작 화면 */
        .start-screen {
            text-align: center;
            padding: 20px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .input-field {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-light);
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* 탭 상단 메뉴 */
        .tabs {
            display: flex;
            background: #eef2ff;
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--subtext);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 어휘 학습 플래시카드 */
        .flashcard-container {
            perspective: 1000px;
            height: 320px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border: 2px solid #e0e7ff;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f8fafc;
            border-color: #c7d2fe;
        }

        .card-english-desc {
            font-size: 1.1rem;
            color: #374151;
            line-height: 1.5;
            font-weight: 600;
            word-break: keep-all;
        }

        .card-img-back {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }

        .card-word {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .card-meaning {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--subtext);
            margin-top: 16px;
            background: #f3f4f6;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .card-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ctrl-btn {
            background: #e0e7ff;
            color: var(--primary);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-indicator {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--subtext);
        }

        /* 어휘 퀴즈 영역 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
            background: #f8fafc;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--wrong);
            color: #991b1b;
        }

        .toggle-expl-btn {
            width: 100%;
            background: #f3f4f6;
            border: 1px dashed #9ca3af;
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        .quiz-explanation {
            margin-top: 8px;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            line-height: 1.4;
            display: none;
            color: #374151;
        }

        .quiz-nav-btn {
            width: 100%;
            margin-top: 16px;
        }

        /* 캡처 결과 화면 */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-card {
            background: #f8fafc;
            border: 2px dashed #a5b4fc;
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            text-align: left;
        }

        .result-item {
            font-size: 1rem;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .result-item:last-child { border-bottom: none; }

        .result-score-highlight {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin: 12px 0;
        }

        .capture-notice {
            font-size: 0.85rem;
            color: var(--wrong);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>옥스포드 사전(OED) 우리말 영단어</h1>

    <!-- 시작 화면 -->
    <div id="start-screen" class="start-screen">
        <p style="color: var(--subtext); font-size: 0.95rem;">학습 및 퀴즈 제출을 위해 학번과 이름을 입력해주세요.</p>
        <div class="input-group">
            <input type="text" id="student-id" class="input-field" placeholder="학번 (예: 20301)" autocomplete="off">
            <input type="text" id="student-name" class="input-field" placeholder="이름 (예: 홍길동)" autocomplete="off">
        </div>
        <button class="primary-btn" onclick="startApp()">학습 시작하기</button>
    </div>

    <!-- 메인 앱 콘텐츠 -->
    <div id="main-app" style="display: none;">
        <!-- 탭 메뉴 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('card')">🃏 어휘 학습</button>
            <button class="tab-btn" onclick="setTab('quiz')">📝 어휘 퀴즈</button>
        </div>

        <!-- 어휘 학습 영역 -->
        <div id="tab-card" class="tab-content active">
            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="card-inner">
                    <!-- 앞면: 영영 풀이 -->
                    <div class="card-face">
                        <div class="card-english-desc" id="card-eng-desc">English Description</div>
                        <div class="card-hint">👆 터치하면 단어, 우리말 뜻, 이미지가 나와요</div>
                    </div>
                    <!-- 뒷면: 이미지 + 어휘(영어) + 우리말 뜻 -->
                    <div class="card-face card-back">
                        <img id="card-img" class="card-img-back" src="" alt="Word Image">
                        <div class="card-word" id="card-word">Kimchi</div>
                        <div class="card-meaning" id="card-meaning">김치</div>
                    </div>
                </div>
            </div>
            <div class="card-controls">
                <button class="ctrl-btn" onclick="prevCard()">이전</button>
                <span class="card-indicator" id="card-num">1 / 44</span>
                <button class="ctrl-btn" onclick="nextCard()">다음</button>
            </div>
        </div>

        <!-- 어휘 퀴즈 영역 -->
        <div id="tab-quiz" class="tab-content">
            <div class="quiz-header">
                <span id="quiz-num">문제 1 / 44</span>
                <span id="quiz-score">점수: 0</span>
            </div>
            
            <div class="quiz-question" id="quiz-q-text">English Description</div>

            <div class="options" id="quiz-options"></div>

            <button class="toggle-expl-btn" id="expl-toggle-btn" onclick="toggleExplanation()">💡 해설 및 우리말 뜻 보기</button>
            <div class="quiz-explanation" id="quiz-expl"></div>

            <button class="primary-btn quiz-nav-btn" id="quiz-next-btn" style="display: none;" onclick="nextQuiz()">다음 문제</button>
        </div>

        <!-- 결과/캡처 화면 -->
        <div class="result-screen" id="result-screen">
            <h2>🎉 모든 학습 완료!</h2>
            <p class="capture-notice">📸 아래 결과를 캡처하여 제출하세요.</p>

            <div class="result-card">
                <div class="result-item">
                    <span style="color:var(--subtext)">학번</span>
                    <span id="res-id" style="font-weight:bold">-</span>
                </div>
                <div class="result-item">
                    <span style="color:var(--subtext)">이름</span>
                    <span id="res-name" style="font-weight:bold">-</span>
                </div>
                <div class="result-item">
                    <span style="color:var(--subtext)">소요 시간</span>
                    <span id="res-time" style="font-weight:bold">0분 0초</span>
                </div>
                <div class="result-score-highlight" id="res-score">0 / 44</div>
            </div>

            <button class="primary-btn" onclick="restartApp()">다시 학습하기</button>
        </div>
    </div>
</div>

let studentId = "";
let studentName = "";
let currentCardIdx = 0;
let currentQuizIdx = 0;
let quizScore = 0;
let selectedOption = null;
let startTime = null;

function startApp() {
    studentId = document.getElementById('student-id').value.trim();
    studentName = document.getElementById('student-name').value.trim();

    if (!studentId || !studentName) {
        alert("학번과 이름을 모두 입력해주세요!");
        return;
    }

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';

    startTime = Date.now();
    updateCard();
    loadQuiz();
}

function setTab(type) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(cont => cont.classList.remove('active'));

    if (type === 'card') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-card').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-quiz').classList.add('active');
    }
}

/* 어휘 학습 카드 제어 */
function flipCard() {
    document.getElementById('card-inner').classList.toggle('flipped');
}

function updateCard() {
    const cardInner = document.getElementById('card-inner');
    cardInner.classList.remove('flipped');

    setTimeout(() => {
        const item = data[currentCardIdx];
        document.getElementById('card-eng-desc').innerText = item.desc;
        document.getElementById('card-word').innerText = item.word;
        document.getElementById('card-meaning').innerText = item.kor;
        document.getElementById('card-img').src = item.img;
        document.getElementById('card-num').innerText = `${currentCardIdx + 1} / ${data.length}`;
    }, 150);
}

function nextCard() {
    if (currentCardIdx < data.length - 1) {
        currentCardIdx++;
        updateCard();
    }
}

function prevCard() {
    if (currentCardIdx > 0) {
        currentCardIdx--;
        updateCard();
    }
}

/* 어휘 퀴즈 제어 */
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function loadQuiz() {
    const item = data[currentQuizIdx];
    selectedOption = null;

    document.getElementById('quiz-num').innerText = `문제 ${currentQuizIdx + 1} / ${data.length}`;
    document.getElementById('quiz-score').innerText = `점수: ${quizScore}`;
    document.getElementById('quiz-q-text').innerText = item.desc;

    // 보기 생성 (4지선다, 단어 객체 포함)
    let choices = [{ word: item.word, kor: item.kor }];
    while (choices.length < 4) {
        let randItem = data[Math.floor(Math.random() * data.length)];
        if (!choices.some(c => c.word === randItem.word)) {
            choices.push({ word: randItem.word, kor: randItem.kor });
        }
    }
    choices = shuffle(choices);

    const optionsDiv = document.getElementById('quiz-options');
    optionsDiv.innerHTML = '';
    choices.forEach((choiceObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        // 선택지 양식: 번호) 영어단어 (우리말)
        btn.innerText = `${idx + 1}) ${choiceObj.word} (${choiceObj.kor})`;
        btn.onclick = () => selectQuizOption(choiceObj.word, btn);
        optionsDiv.appendChild(btn);
    });

    // 해설 초기화
    document.getElementById('expl-toggle-btn').style.display = 'none';
    document.getElementById('quiz-expl').style.display = 'none';
    document.getElementById('quiz-next-btn').style.display = 'none';
}

function selectQuizOption(choiceWord, btnElem) {
    if (selectedOption !== null) return;

    const item = data[currentQuizIdx];
    selectedOption = choiceWord;

    const allBtns = document.querySelectorAll('#quiz-options .option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (choiceWord === item.word) {
        btnElem.classList.add('correct');
        quizScore++;
        document.getElementById('quiz-score').innerText = `점수: ${quizScore}`;
    } else {
        btnElem.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.innerText.includes(`${item.word} (`)) {
                b.classList.add('correct');
            }
        });
    }

    // 풀이 내용 (우리말 뜻 중심)
    const explBox = document.getElementById('quiz-expl');
    explBox.innerHTML = `<strong>정답: ${item.word}</strong><br><span>우리말 뜻: ${item.kor}</span>`;

    document.getElementById('expl-toggle-btn').style.display = 'block';
    document.getElementById('quiz-next-btn').style.display = 'block';
}

function toggleExplanation() {
    const explBox = document.getElementById('quiz-expl');
    explBox.style.display = (explBox.style.display === 'block') ? 'none' : 'block';
}

function nextQuiz() {
    currentQuizIdx++;
    if (currentQuizIdx < data.length) {
        loadQuiz();
    } else {
        showResult();
    }
}

/* 최종 결과 */
function showResult() {
    document.querySelectorAll('.tabs, .tab-content').forEach(e => e.style.display = 'none');
    document.getElementById('result-screen').style.display = 'block';

    const totalSec = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;

    document.getElementById('res-id').innerText = studentId;
    document.getElementById('res-name').innerText = studentName;
    document.getElementById('res-time').innerText = `${min}분 ${sec}초`;
    document.getElementById('res-score').innerText = `${quizScore} / ${data.length} 점`;
}

function restartApp() {
    currentCardIdx = 0;
    currentQuizIdx = 0;
    quizScore = 0;
    
    document.getElementById('result-screen').style.display = 'none';
    document.querySelectorAll('.tabs').forEach(e => e.style.display = 'flex');
    setTab('card');
    startApp();
}
</script>

</body>
</html>

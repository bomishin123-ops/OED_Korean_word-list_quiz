<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED 우리말 영단어 학습 앱</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --subtext: #6b7280;
            --correct: #10b981;
            --wrong: #ef4444;
            --accent: #8b5cf6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.35rem;
            margin: 0 0 16px 0;
            font-weight: 800;
        }

        /* 시작 화면 */
        .start-screen {
            text-align: center;
            padding: 20px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .input-field {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-light);
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* 탭 상단 메뉴 */
        .tabs {
            display: flex;
            background: #eef2ff;
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--subtext);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 어휘 학습 플래시카드 */
        .flashcard-container {
            perspective: 1000px;
            height: 280px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            border: 2px solid #e0e7ff;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f8fafc;
            border-color: #c7d2fe;
        }

        .card-english-desc {
            font-size: 1.05rem;
            color: #374151;
            line-height: 1.5;
            font-weight: 600;
            word-break: keep-all;
        }

        .card-word {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .card-meaning {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            word-break: keep-all;
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--subtext);
            margin-top: 20px;
            background: #f3f4f6;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .card-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ctrl-btn {
            background: #e0e7ff;
            color: var(--primary);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-indicator {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--subtext);
        }

        /* 어휘 퀴즈 영역 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
            background: #f8fafc;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--wrong);
            color: #991b1b;
        }

        .toggle-expl-btn {
            width: 100%;
            background: #f3f4f6;
            border: 1px dashed #9ca3af;
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        .quiz-explanation {
            margin-top: 8px;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            line-height: 1.4;
            display: none;
            color: #374151;
        }

        .quiz-nav-btn {
            width: 100%;
            margin-top: 16px;
        }

        /* 캡처 결과 화면 */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-card {
            background: #f8fafc;
            border: 2px dashed #a5b4fc;
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            text-align: left;
        }

        .result-item {
            font-size: 1rem;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .result-item:last-child { border-bottom: none; }

        .result-score-highlight {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin: 12px 0;
        }

        .capture-notice {
            font-size: 0.85rem;
            color: var(--wrong);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>옥스포드 사전(OED) 우리말 영단어</h1>

    <!-- 시작 화면 -->
    <div id="start-screen" class="start-screen">
        <p style="color: var(--subtext); font-size: 0.95rem;">학습 및 퀴즈 제출을 위해 학번과 이름을 입력해주세요.</p>
        <div class="input-group">
            <input type="text" id="student-id" class="input-field" placeholder="학번 (예: 20301)" autocomplete="off">
            <input type="text" id="student-name" class="input-field" placeholder="이름 (예: 홍길동)" autocomplete="off">
        </div>
        <button class="primary-btn" onclick="startApp()">학습 시작하기</button>
    </div>

    <!-- 메인 앱 콘텐츠 -->
    <div id="main-app" style="display: none;">
        <!-- 탭 메뉴 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('card')">🃏 어휘 학습</button>
            <button class="tab-btn" onclick="setTab('quiz')">📝 어휘 퀴즈</button>
        </div>

        <!-- 어휘 학습 영역 -->
        <div id="tab-card" class="tab-content active">
            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="card-inner">
                    <!-- 앞면: 영영 풀이 -->
                    <div class="card-face">
                        <div class="card-english-desc" id="card-eng-desc">English Description</div>
                        <div class="card-hint">👆 터치하면 단어와 우리말 뜻이 나와요</div>
                    </div>
                    <!-- 뒷면: 어휘(영어) + 우리말 뜻 -->
                    <div class="card-face card-back">
                        <div class="card-word" id="card-word">Korean</div>
                        <div class="card-meaning" id="card-meaning">한국어</div>
                    </div>
                </div>
            </div>
            <div class="card-controls">
                <button class="ctrl-btn" onclick="prevCard()">이전</button>
                <span class="card-indicator" id="card-num">1 / 50</span>
                <button class="ctrl-btn" onclick="nextCard()">다음</button>
            </div>
        </div>

        <!-- 어휘 퀴즈 영역 -->
        <div id="tab-quiz" class="tab-content">
            <div class="quiz-header">
                <span id="quiz-num">문제 1 / 50</span>
                <span id="quiz-score">점수: 0</span>
            </div>
            
            <div class="quiz-question" id="quiz-q-text">English Description</div>

            <div class="options" id="quiz-options"></div>

            <button class="toggle-expl-btn" id="expl-toggle-btn" onclick="toggleExplanation()">💡 해설 및 우리말 뜻 보기</button>
            <div class="quiz-explanation" id="quiz-expl"></div>

            <button class="primary-btn quiz-nav-btn" id="quiz-next-btn" style="display: none;" onclick="nextQuiz()">다음 문제</button>
        </div>

        <!-- 결과/캡처 화면 -->
        <div class="result-screen" id="result-screen">
            <h2>🎉 모든 학습 완료!</h2>
            <p class="capture-notice">📸 아래 결과를 캡처하여 제출하세요.</p>

            <div class="result-card">
                <div class="result-item">
                    <span style="color:var(--subtext)">학번</span>
                    <span id="res-id" style="font-weight:bold">-</span>
                </div>
                <div class="result-item">
                    <span style="color:var(--subtext)">이름</span>
                    <span id="res-name" style="font-weight:bold">-</span>
                </div>
                <div class="result-item">
                    <span style="color:var(--subtext)">소요 시간</span>
                    <span id="res-time" style="font-weight:bold">0분 0초</span>
                </div>
                <div class="result-score-highlight" id="res-score">0 / 50</div>
            </div>

            <button class="primary-btn" onclick="restartApp()">다시 학습하기</button>
        </div>
    </div>
</div>

<script>
// 작성해주신 텍스트 원문 그대로 반영 (고노, 리, 언문, 주체, 당수도 5개 제외 -> 총 50개 어휘)
const data = [
    { word: "Korean", kor: "한국어", desc: "The language spoken by the people of Korea and written mainly in Hangul." },
    { word: "gisaeng", kor: "기생", desc: "A female entertainer in traditional Korea who was trained in music, dance, and poetry." },
    { word: "Hangul", kor: "한글", desc: "The writing system used to write the Korean language, created during the Joseon Dynasty." },
    { word: "kimchi", kor: "김치", desc: "A traditional Korean dish made by fermenting vegetables with red pepper powder and other seasonings." },
    { word: "myon", kor: "면", desc: "A Korean word meaning noodles, used in the names of many Korean noodle dishes." },
    { word: "makkoli", kor: "막걸리", desc: "A traditional Korean rice wine with a milky appearance and a slightly sweet taste." },
    { word: "sijo", kor: "시조", desc: "A traditional Korean poem with a fixed form and rhythm." },
    { word: "taekwondo", kor: "태권도", desc: "A Korean martial art that is famous for its powerful kicking techniques." },
    { word: "won", kor: "원", desc: "The official unit of money used in South Korea." },
    { word: "yangban", kor: "양반", desc: "A member of the highest social class during the Joseon Dynasty." },
    { word: "ondol", kor: "온돌", desc: "A traditional Korean floor-heating system that keeps rooms warm." },
    { word: "hapkido", kor: "합기도", desc: "A Korean martial art that uses kicks, punches, throws, and joint-locking techniques." },
    { word: "bibimbap", kor: "비빔밥", desc: "A Korean rice dish mixed with vegetables, meat, egg, and gochujang." },
    { word: "soju", kor: "소주", desc: "A clear Korean alcoholic drink usually made from rice or other grains." },
    { word: "webtoon", kor: "웹툰", desc: "A digital comic designed mainly to be read on smartphones or computers." },
    { word: "K-pop", kor: "케이팝", desc: "Popular music from South Korea, known for its singers, dance performances, and global fans." },
    { word: "gochujang", kor: "고추장", desc: "A thick, spicy Korean paste made mainly from red chili powder, rice, and fermented soybeans." },
    { word: "doenjang", kor: "된장", desc: "A traditional Korean paste made from fermented soybeans and used to season many dishes." },
    { word: "chaebol", kor: "재벌", desc: "A large South Korean business group owned or controlled by one family." },
    { word: "aegyo", kor: "애교", desc: "Cute behavior or a charming way of speaking used to show affection." },
    { word: "banchan", kor: "반찬", desc: "Small side dishes served with rice as part of a Korean meal." },
    { word: "bulgogi", kor: "불고기", desc: "A Korean dish of thinly sliced meat that is marinated and then grilled or cooked." },
    { word: "chimaek", kor: "치맥", desc: "A popular Korean combination of fried chicken and beer." },
    { word: "daebak", kor: "대박", desc: "A Korean expression used when something is surprising, impressive, or very successful." },
    { word: "dongchimi", kor: "동치미", desc: "A type of kimchi made with radish in a cool, clear, and lightly seasoned liquid." },
    { word: "fighting", kor: "파이팅", desc: "A Korean expression used to encourage someone and wish them success." },
    { word: "galbi", kor: "갈비", desc: "A Korean dish made from marinated beef or pork ribs, usually grilled." },
    { word: "hallyu", kor: "한류 (Korean wave)", desc: "The worldwide popularity of South Korean culture, including music, television, film, and food." },
    { word: "hanbok", kor: "한복", desc: "Traditional Korean clothing, often worn on holidays, weddings, and other special occasions." },
    { word: "japchae", kor: "잡채", desc: "A Korean dish of glass noodles stir-fried with vegetables and sometimes meat." },
    { word: "K-", kor: "케이-", desc: "A prefix used to show that something comes from or is connected with Korea." },
    { word: "K-drama", kor: "케이드라마", desc: "A television drama made in South Korea, often watched by audiences around the world." },
    { word: "kimbap", kor: "김밥", desc: "A Korean dish of rice and other ingredients rolled in dried seaweed and cut into pieces." },
    { word: "Konglish", kor: "콩글리시", desc: "English words or expressions used in Korean in ways that may differ from standard English." },
    { word: "manhwa", kor: "만화", desc: "A Korean comic book or a style of comics created in Korea." },
    { word: "mukbang", kor: "먹방", desc: "An online video or broadcast in which a person eats food while talking to viewers." },
    { word: "noona", kor: "누나", desc: "A Korean word used by a male to address an older sister or an older female friend." },
    { word: "oppa", kor: "오빠", desc: "A Korean word used by a female to address an older brother or an older male friend." },
    { word: "PC bang", kor: "피시방", desc: "An internet café in Korea where people use computers, especially to play online games." },
    { word: "samgyeopsal", kor: "삼겹살", desc: "A Korean dish of thick slices of pork belly, usually grilled at the table." },
    { word: "skinship", kor: "스킨십", desc: "Physical contact used to show closeness or affection between people." },
    { word: "trot", kor: "트로트", desc: "A style of Korean popular music known for its strong rhythm and emotional singing." },
    { word: "unni", kor: "언니", desc: "A Korean word used by a female to address an older sister or an older female friend." },
    { word: "dalgona", kor: "달고나", desc: "A Korean sweet made by heating sugar and baking soda, often shaped with a simple pattern." },
    { word: "hyung", kor: "형", desc: "A Korean word used by a male to address an older brother or an older male friend." },
    { word: "jjigae", kor: "찌개", desc: "A Korean stew made with meat, seafood, tofu, or vegetables and served hot." },
    { word: "maknae", kor: "막내", desc: "The youngest member of a family, group, or team." },
    { word: "noraebang", kor: "노래방", desc: "A private singing room in Korea where people sing along to recorded music." },
    { word: "pansori", kor: "판소리", desc: "A traditional Korean musical performance in which a singer tells a long story with a drummer." },
    { word: "tteokbokki", kor: "떡볶이", desc: "A popular Korean dish of rice cakes cooked in a spicy red sauce." },
    { word: "haenyeo", kor: "해녀", desc: "A female diver, especially from Jeju Island, who collects seafood without using breathing equipment." },
    { word: "bingsu", kor: "빙수", desc: "A Korean dessert made with finely shaved ice and sweet toppings such as fruit or red beans." },
    { word: "officetel", kor: "오피스텔", desc: "A building or room in Korea designed to be used as both an office and a home." },
    { word: "ramyeon", kor: "라면", desc: "Korean-style instant noodles, usually cooked and served in a hot, spicy soup." },
    { word: "sunbae", kor: "선배", desc: "A person with more experience or a higher position in a school, workplace, or group." },
    { word: "jjimjilbang", kor: "찜질방", desc: "A large Korean public bathhouse with hot rooms, saunas, and shared resting areas." },
    { word: "ajumma", kor: "아줌마", desc: "A Korean term for a married or middle-aged woman, sometimes used as a form of address." },
    { word: "Korean barbecue", kor: "코리안 바비큐", desc: "A style of Korean meal in which meat is grilled at the table and eaten with side dishes." }
];

let studentId = "";
let studentName = "";
let currentCardIdx = 0;
let currentQuizIdx = 0;
let quizScore = 0;
let selectedOption = null;
let startTime = null;

function startApp() {
    studentId = document.getElementById('student-id').value.trim();
    studentName = document.getElementById('student-name').value.trim();

    if (!studentId || !studentName) {
        alert("학번과 이름을 모두 입력해주세요!");
        return;
    }

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';

    startTime = Date.now();
    updateCard();
    loadQuiz();
}

function setTab(type) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(cont => cont.classList.remove('active'));

    if (type === 'card') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-card').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-quiz').classList.add('active');
    }
}

/* 어휘 학습 카드 제어 */
function flipCard() {
    document.getElementById('card-inner').classList.toggle('flipped');
}

function updateCard() {
    const cardInner = document.getElementById('card-inner');
    cardInner.classList.remove('flipped');

    setTimeout(() => {
        const item = data[currentCardIdx];
        document.getElementById('card-eng-desc').innerText = item.desc;
        document.getElementById('card-word').innerText = item.word;
        document.getElementById('card-meaning').innerText = item.kor;
        document.getElementById('card-num').innerText = `${currentCardIdx + 1} / ${data.length}`;
    }, 150);
}

function nextCard() {
    if (currentCardIdx < data.length - 1) {
        currentCardIdx++;
        updateCard();
    }
}

function prevCard() {
    if (currentCardIdx > 0) {
        currentCardIdx--;
        updateCard();
    }
}

/* 어휘 퀴즈 제어 */
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function loadQuiz() {
    const item = data[currentQuizIdx];
    selectedOption = null;

    document.getElementById('quiz-num').innerText = `문제 ${currentQuizIdx + 1} / ${data.length}`;
    document.getElementById('quiz-score').innerText = `점수: ${quizScore}`;
    document.getElementById('quiz-q-text').innerText = item.desc;

    // 보기 생성 (4지선다)
    let choices = [{ word: item.word, kor: item.kor }];
    while (choices.length < 4) {
        let randItem = data[Math.floor(Math.random() * data.length)];
        if (!choices.some(c => c.word === randItem.word)) {
            choices.push({ word: randItem.word, kor: randItem.kor });
        }
    }
    choices = shuffle(choices);

    const optionsDiv = document.getElementById('quiz-options');
    optionsDiv.innerHTML = '';
    choices.forEach((choiceObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}) ${choiceObj.word} (${choiceObj.kor})`;
        btn.onclick = () => selectQuizOption(choiceObj.word, btn);
        optionsDiv.appendChild(btn);
    });

    document.getElementById('expl-toggle-btn').style.display = 'none';
    document.getElementById('quiz-expl').style.display = 'none';
    document.getElementById('quiz-next-btn').style.display = 'none';
}

function selectQuizOption(choiceWord, btnElem) {
    if (selectedOption !== null) return;

    const item = data[currentQuizIdx];
    selectedOption = choiceWord;

    const allBtns = document.querySelectorAll('#quiz-options .option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (choiceWord === item.word) {
        btnElem.classList.add('correct');
        quizScore++;
        document.getElementById('quiz-score').innerText = `점수: ${quizScore}`;
    } else {
        btnElem.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.innerText.includes(`${item.word} (`)) {
                b.classList.add('correct');
            }
        });
    }

    const explBox = document.getElementById('quiz-expl');
    explBox.innerHTML = `<strong>정답: ${item.word}</strong><br><span>우리말 뜻: ${item.kor}</span>`;

    document.getElementById('expl-toggle-btn').style.display = 'block';
    document.getElementById('quiz-next-btn').style.display = 'block';
}

function toggleExplanation() {
    const explBox = document.getElementById('quiz-expl');
    explBox.style.display = (explBox.style.display === 'block') ? 'none' : 'block';
}

function nextQuiz() {
    currentQuizIdx++;
    if (currentQuizIdx < data.length) {
        loadQuiz();
    } else {
        showResult();
    }
}

/* 최종 결과 */
function showResult() {
    document.querySelectorAll('.tabs, .tab-content').forEach(e => e.style.display = 'none');
    document.getElementById('result-screen').style.display = 'block';

    const totalSec = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;

    document.getElementById('res-id').innerText = studentId;
    document.getElementById('res-name').innerText = studentName;
    document.getElementById('res-time').innerText = `${min}분 ${sec}초`;
    document.getElementById('res-score').innerText = `${quizScore} / ${data.length} 점`;
}

function restartApp() {
    currentCardIdx = 0;
    currentQuizIdx = 0;
    quizScore = 0;
    
    document.getElementById('result-screen').style.display = 'none';
    document.querySelectorAll('.tabs').forEach(e => e.style.display = 'flex');
    setTab('card');
    startApp();
}
</script>

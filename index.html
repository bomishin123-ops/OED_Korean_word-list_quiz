<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED 우리말 퀴즈 앱</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --correct: #16a34a;
            --wrong: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0 0 8px 0;
            font-weight: 800;
        }

        /* 1. 시작 화면 (학번/이름 입력) */
        .start-screen {
            text-align: center;
            padding: 10px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0;
        }

        .input-field {
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-light);
        }

        .start-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background: #1e40af;
        }

        /* 2. 퀴즈 진행 화면 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress {
            height: 100%;
            background: var(--primary-light);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--subtext);
            margin-top: 8px;
        }

        .question-card {
            margin-top: 20px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            background: #e2e8f0;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--correct);
            color: #14532d;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--wrong);
            color: #7f1d1d;
        }

        .next-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: #1e40af;
        }

        /* 3. 캡처용 결과 화면 */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-card {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .result-item {
            font-size: 1.05rem;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .result-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .result-label {
            color: var(--subtext);
            font-weight: 500;
        }

        .result-value {
            font-weight: bold;
            color: var(--text);
        }

        .result-score-highlight {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-light);
            text-align: center;
            margin: 15px 0;
        }

        .capture-notice {
            font-size: 0.9rem;
            color: #ef4444;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .restart-btn {
            background: var(--primary-light);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>옥스포드 영어 사전(OED) 등재 우리말 퀴즈</h1>
    </header>

    <!-- 1단계: 학번/이름 입력 화면 -->
    <div id="start-screen" class="start-screen">
        <p>퀴즈를 시작하기 전에 학번과 이름을 입력해주세요.</p>
        <div class="input-group">
            <input type="text" id="student-id" class="input-field" placeholder="학번 (예: 20301)" autocomplete="off">
            <input type="text" id="student-name" class="input-field" placeholder="이름 (예: 홍길동)" autocomplete="off">
        </div>
        <button class="start-btn" onclick="startQuiz()">퀴즈 시작하기</button>
    </div>

    <!-- 2단계: 퀴즈 진행 화면 -->
    <main id="quiz-screen" style="display: none;">
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        <div class="status">
            <span id="question-count">문제 1 / 44</span>
            <span id="score-count">점수: 0</span>
        </div>

        <div class="question-card">
            <div class="question-text" id="question">문제를 불러오는 중...</div>
            <div class="options" id="options"></div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제</button>
    </main>

    <!-- 3단계: 결과 및 캡처 화면 -->
    <div class="result-screen" id="result-screen">
        <h2>🎉 퀴즈 완료!</h2>
        <div class="capture-notice">📸 아래 화면을 캡처하여 제출하세요!</div>

        <div class="result-card" id="capture-area">
            <div class="result-item">
                <span class="result-label">학번</span>
                <span class="result-value" id="res-id">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">이름</span>
                <span class="result-value" id="res-name">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">소요 시간</span>
                <span class="result-value" id="res-time">0분 0초</span>
            </div>
            <div class="result-score-highlight" id="res-score">0 / 44</div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">다시 풀기</button>
    </div>
</div>

<script>
const quizData = [
    { q: "한국의 대표적인 발효 채소 음식으로 배추, 무 등에 고춧가루와 양념을 더해 만드는 요리는?", options: ["Kimchi", "Bulgogi", "K-barbecue", "Banchan"], answer: 0 },
    { q: "한국의 대중문화(음악, 드라마, 영화 등)가 전 세계적으로 인기를 얻는 현상을 뜻하는 단어는?", options: ["Hanbok", "Hallyu", "Mukbang", "Daebak"], answer: 1 },
    { q: "한국의 고유 무술로, 손과 발을 사용해 공격과 방어를 하며 올림픽 정식 종목인 스포츠는?", options: ["Taekwondo", "Tangsoodo", "K-pop", "Aegyo"], answer: 0 },
    { q: "한국 식사 때 밥과 함께 제공되는 작은 접시의 여러 가지 밑반찬을 뜻하는 단어는?", options: ["Galbi", "Banchan", "Japchae", "Gimbap"], answer: 1 },
    { q: "양념한 쇠고기를 불에 구워 먹는 대표적인 한국 전통 고기 요리는?", options: ["Samgyeopsal", "Bulgogi", "Galbi", "Chimaek"], answer: 1 },
    { q: "소나 돼지의 갈비 부위에 양념을 하거나 생으로 구워 먹는 요리는?", options: ["Galbi", "Buldak", "Tangsuyuk", "Trot"], answer: 0 },
    { q: "밥 위에 여러 나물과 고기, 고추장 등을 넣고 비벼 먹는 요리는?", options: ["Gimbap", "Bibimbap", "Tteokbokki", "Japchae"], answer: 1 },
    { q: "당면과 여러 채소, 고기를 함께 볶아 만드는 한국 전통 면 요리는?", options: ["K-noodle", "Ramyeon", "Japchae", "Naengmyeon"], answer: 2 },
    { q: "김 위에 밥과 여러 재료를 올리고 말아서 썰어 먹는 음식은?", options: ["Gimbap", "Rice cake", "Mandu", "Ssambu"], answer: 0 },
    { q: "떡과 어묵 등을 매콤달콤한 양념에 볶아서 만드는 길거리 인기 간식은?", options: ["Tteokbokki", "Sundae", "Odeng", "Hotteok"], answer: 0 },
    { q: "한국 전통 상의(저고리)와 하의(치마/바지)로 구성된 옷은?", options: ["Hanbok", "Hanok", "K-style", "Cheongsam"], answer: 0 },
    { q: "한국 전통 건축 양식으로 지어진 기와집이나 초가집 등의 집을 뜻하는 단어는?", options: ["Hanok", "Ondol", "Hanbok", "Maru"], answer: 0 },
    { q: "음식을 먹는 방송이나 영상을 뜻하는 단어로, 사전에도 그대로 등재된 표현은?", options: ["Cookbang", "Mukbang", "Meokja", "Foodcam"], answer: 1 },
    { q: "치킨과 맥주를 함께 즐기는 한국 특유의 식문화를 일컫는 단어는?", options: ["Chimaek", "Somaek", "Chicken-beer", "Anju"], answer: 0 },
    { q: "여성이나 남성이 상대방에게 보이는 귀여운 행동이나 표정을 뜻하는 단어는?", options: ["Aegyo", "Oppa", "Unni", "K-cute"], answer: 0 },
    { q: "여성이 자신보다 나이가 많은 남성(친오빠나 남선배)을 부르는 호칭은?", options: ["Oppa", "Hyung", "Unni", "Noona"], answer: 0 },
    { q: "여성이 자신보다 나이가 많은 여성(친언니나 여선배)을 부르는 호칭은?", options: ["Unni", "Noona", "Oppa", "Hyung"], answer: 0 },
    { q: "남성이 자신보다 나이가 많은 남성(친형이나 남선배)을 부르는 호칭은?", options: ["Hyung", "Oppa", "Sunbae", "Noona"], answer: 0 },
    { q: "남성이 자신보다 나이가 많은 여성(친누나나 여선배)을 부르는 호칭은?", options: ["Noona", "Unni", "Oppa", "Imo"], answer: 0 },
    { q: "대단하다!, 성공했다! 등의 감탄을 나타낼 때 쓰는 한국어 표현은?", options: ["Daebak", "Fighting", "Jjang", "Hul"], answer: 0 },
    { q: "한국에서 응원하거나 힘을 낼 때 자주 쓰는 외침(파이팅)은?", options: ["Fighting", "Aja", "Bravo", "Cheer"], answer: 0 },
    { q: "한국의 대중음악 장르로, 전 세계적인 팬덤을 가지고 있는 음악은?", options: ["K-pop", "Trot", "Gugak", "K-rock"], answer: 0 },
    { q: "한국의 전통 대중가요 장르 중 하나로, 독특한 꺾기 가창법이 특징인 음악은?", options: ["Trot", "Arirang", "Pansori", "K-ballad"], answer: 0 },
    { q: "한국 전통 소리꾼이 고수의 북 장단에 맞춰 이야기와 노래를 풀어내는 전통 공연 예술은?", options: ["Pansori", "Samulnori", "Minyo", "Talchum"], answer: 0 },
    { q: "꽹과리, 장구, 북, 징의 네 가지 악기로 연주하는 한국 전통 풍물놀이는?", options: ["Samulnori", "Nongak", "Namsadang", "Pansori"], answer: 0 },
    { q: "얇게 썬 돼지 삼겹살 부위를 불판에 구워 먹는 한국인들이 좋아하는 구이 요리는?", options: ["Samgyeopsal", "Bossam", "Jokbal", "Daktagalbi"], answer: 0 },
    { q: "한국식 수제 만두 피에 고기, 채소 등을 넣어 찌거나 튀겨 먹는 음식은?", options: ["Mandu", "Dimsum", "Gyoza", "Buns"], answer: 0 },
    { q: "국물에 인삼, 대추, 찹쌀 등을 넣고 영계 한 마리를 통째로 삶아 내는 보양식은?", options: ["Samgyetang", "Galbitang", "Seolleongtang", "Dakbokkeumtang"], answer: 0 },
    { q: "매우 매운 양념으로 조리된 닭고기 요리로, 매운 맛으로 잘 알려진 요리는?", options: ["Buldak", "Dakgalbi", "Chimaek", "Fried Chicken"], answer: 0 },
    { q: "테이블에서 손님이 직접 고기나 채소를 구워 먹는 한국 특유의 바비큐 문화를 뜻하는 말은?", options: ["K-barbecue", "K-food", "Roast Pork", "Table Grill"], answer: 0 },
    { q: "한국의 드라마 작품들을 통틀어 부르는 단어는?", options: ["K-drama", "K-movie", "Soap opera", "Han-drama"], answer: 0 },
    { q: "한국 신문, 방송, 포털 사이트 등에서 전하는 대중적인 소식이나 언론 매체를 뜻하는 단어는?", options: ["K-news", "Han-news", "Press", "Media"], answer: 0 },
    { q: "한국의 뷰티 상품, 화장품, 피부 관리 기술 등을 종합적으로 이르는 단어는?", options: ["K-beauty", "K-style", "Skin-care", "Han-beauty"], answer: 0 },
    { q: "한국에서 제작되거나 한국 고유의 양식으로 만들어진 만화/웹툰을 이르는 단어는?", options: ["Manhwa", "Manga", "Comic", "Webtoon"], answer: 0 },
    { q: "한국의 온돌 방바닥이나 거실 마루 등 바닥에 직접 앉는 생활 방식을 뜻하는 단어는?", options: ["Ondol", "Sedentary", "Maru", "Floor life"], answer: 0 },
    { q: "한국의 장류 중 하나로, 콩을 발효시켜 만드는 전통 구수한 양념장은?", options: ["Doenjang", "Gochujang", "Ganjang", "Ssamjang"], answer: 0 },
    { q: "붉은 고추와 찹쌀, 메주 등을 넣어 만드는 매콤한 한국 전통 장류는?", options: ["Gochujang", "Doenjang", "Ssamjang", "Chogochujang"], answer: 0 },
    { q: "고기나 밥을 상추, 깻잎 등에 싸서 먹을 때 함께 넣어 먹는 양념 쌈장은?", options: ["Ssamjang", "Gochujang", "Doenjang", "Ganjang"], answer: 0 },
    { q: "한국의 전통 현악기로, 12개의 줄을 손가락으로 뜯거나 튕겨 소리를 내는 악기는?", options: ["Gayageum", "Geomunggo", "Haegeum", "Ajaeng"], answer: 0 },
    { q: "6개의 줄을 거문고 채로 두드리거나 뜯어 소리를 내는 한국 전통 현악기는?", options: ["Geomunggo", "Gayageum", "Piri", "Bipa"], answer: 0 },
    { q: "활로 줄을 문질러 소리를 내며, 2개의 줄을 가진 한국 전통 찰현악기는?", options: ["Haegeum", "Gayageum", "Danso", "Daegeum"], answer: 0 },
    { q: "한국의 전통 술 중 하나로, 쌀 등을 발효시켜 만든 탁하고 흰 빛깔의 전통주는?", options: ["Makgeolli", "Soju", "Cheongju", "Yakju"], answer: 0 },
    { q: "한국에서 가장 흔하게 마시는 증류식 또는 희석식 투명한 알코올 음료는?", options: ["Soju", "Makgeolli", "Poktanju", "Maehwashu"], answer: 0 },
    { q: "술을 마실 때 함께 곁들여 먹는 안주를 뜻하는 단어는?", options: ["Anju", "Banchan", "Side-dish", "Snack"], answer: 0 }
];

let currentIdx = 0;
let score = 0;
let studentId = "";
let studentName = "";
let startTime = null;

function startQuiz() {
    studentId = document.getElementById('student-id').value.trim();
    studentName = document.getElementById('student-name').value.trim();

    if (!studentId || !studentName) {
        alert("학번과 이름을 모두 입력해주세요!");
        return;
    }

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    startTime = Date.now();
    loadQuestion();
}

function loadQuestion() {
    const data = quizData[currentIdx];
    document.getElementById('question').innerText = `${currentIdx + 1}. ${data.q}`;
    document.getElementById('question-count').innerText = `문제 ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById('progress').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
    
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    
    data.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}) ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        optionsDiv.appendChild(btn);
    });

    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(selectedIdx) {
    const data = quizData[currentIdx];
    const buttons = document.querySelectorAll('.option-btn');
    
    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === data.answer) {
            btn.classList.add('correct');
        }
        if (idx === selectedIdx && selectedIdx !== data.answer) {
            btn.classList.add('wrong');
        }
    });

    if (selectedIdx === data.answer) {
        score++;
        document.getElementById('score-count').innerText = `점수: ${score}`;
    }

    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    document.getElementById('res-id').innerText = studentId;
    document.getElementById('res-name').innerText = studentName;
    document.getElementById('res-time').innerText = `${minutes}분 ${seconds}초`;
    document.getElementById('res-score').innerText = `${score} / ${quizData.length} 점`;
}

function restartQuiz() {
    currentIdx = 0;
    score = 0;
    document.getElementById('score-count').innerText = `점수: 0`;
    document.getElementById('result-screen').style.display = 'none';

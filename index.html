<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED 등재 우리말 학습 앱</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 학생 정보 및 타이머 영역 */
        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .info-box input {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .timer-display {
            width: 100%;
            text-align: right;
            font-size: 0.95rem;
            font-weight: bold;
            color: #1e40af;
            margin-top: 4px;
        }

        /* 탭 버튼 */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 1. 학습하기 테이블 */
        .study-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .study-table th, .study-table td {
            border: 1px solid var(--border);
            padding: 10px 12px;
            text-align: left;
            font-size: 0.95rem;
        }

        .study-table th {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* 2. 영영퀴즈 스타일 */
        .quiz-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .quiz-q {
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .quiz-korean {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: normal;
        }

        .quiz-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .quiz-input.correct {
            background-color: #dcfce7;
            border-color: #16a34a;
            color: #14532d;
            font-weight: bold;
        }

        .quiz-input.wrong {
            background-color: #fee2e2;
            border-color: #dc2626;
            color: #7f1d1d;
        }

        .feedback {
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: var(--secondary);
        }

        /* 결과 리포트 상자 */
        .result-box {
            background: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
            display: none;
        }

        .result-header {
            text-align: center;
            color: #166534;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 16px;
            border-bottom: 1px dashed #bbf7d0;
            padding-bottom: 10px;
        }

        .result-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .result-item {
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dcfce7;
        }

        .result-label {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e293b;
        }

        .score-highlight {
            color: #2563eb;
            font-size: 1.4rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[학습지] 옥스포드 사전 등재 우리말</h1>

    <!-- 학생 정보 입력란 및 진행 시간 -->
    <div class="info-box">
        <input type="text" id="student-class" placeholder="학년/반 (예: 2학년 3반)">
        <input type="text" id="student-num" placeholder="번호 (예: 15번)">
        <input type="text" id="student-name" placeholder="이름 (예: 홍길동)">
        <div class="timer-display" id="timer-display">⏱️ 소요 시간: 0분 0초</div>
    </div>

    <!-- 탭 메뉴 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('study')">1. 학습하기</button>
        <button class="tab-btn" onclick="switchTab('quiz')">2. 영영퀴즈 (44문항)</button>
    </div>

    <!-- 1. 학습하기 영역 -->
    <div id="tab-study" class="tab-content active">
        <table class="study-table">
            <thead>
                <tr>
                    <th style="width: 10%;">No.</th>
                    <th style="width: 25%;">OED Entry</th>
                    <th style="width: 35%;">Meaning (영문 의미)</th>
                    <th style="width: 30%;">우리말 뜻</th>
                </tr>
            </thead>
            <tbody id="study-list"></tbody>
        </table>
    </div>

    <!-- 2. 영영퀴즈 영역 -->
    <div id="tab-quiz" class="tab-content">
        <div id="quiz-list"></div>
        <button class="submit-btn" onclick="checkAnswers()">제출 및 채점하기</button>

        <!-- 결과 리포트 -->
        <div class="result-box" id="result-box">
            <div class="result-header">🎉 학습 결과 리포트</div>
            <div class="result-info-grid">
                <div class="result-item">
                    <div class="result-label">학생 정보</div>
                    <div class="result-value" id="res-student-info">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">소요 시간</div>
                    <div class="result-value" id="res-time">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">맞힌 개수</div>
                    <div class="result-value" id="res-count">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">최종 점수 (100점 만점)</div>
                    <div class="result-value score-highlight" id="res-score">-</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const data = [
    { no: 1, word: "Kimchi", desc: "Traditional Korean dish of fermented vegetables, usually napa cabbage or radish.", kor: "김치" },
    { no: 2, word: "Hallyu", desc: "The increase in international popularity of South Korean culture (music, drama, movies).", kor: "한류" },
    { no: 3, word: "Taekwondo", desc: "Traditional Korean martial art using hands and feet for attack and defense.", kor: "태권도" },
    { no: 4, word: "Banchan", desc: "Small side dishes served along with cooked rice in Korean cuisine.", kor: "반찬" },
    { no: 5, word: "Bulgogi", desc: "Thin slices of beef or pork marinated and grilled on a barbecue.", kor: "불고기" },
    { no: 6, word: "Galbi", desc: "Dish of beef or pork ribs marinated and grilled.", kor: "갈비" },
    { no: 7, word: "Bibimbap", desc: "Dish of rice topped with vegetables, meat, and red chili paste, stirred together.", kor: "비빔밥" },
    { no: 8, word: "Japchae", desc: "Dish of stir-fried glass noodles with vegetables and meat.", kor: "잡채" },
    { no: 9, word: "Gimbap", desc: "Korean dish consisting of cooked rice and ingredients rolled in dried sheets of laver.", kor: "김밥" },
    { no: 10, word: "Tteokbokki", desc: "Popular street food made of simmered rice cakes with sweet and spicy sauce.", kor: "떡볶이" },
    { no: 11, word: "Hanbok", desc: "Traditional Korean clothing consisting of a top (jeogori) and skirt/pants.", kor: "한복" },
    { no: 12, word: "Hanok", desc: "Traditional Korean house built with natural materials and unique architecture.", kor: "한옥" },
    { no: 13, word: "Mukbang", desc: "Live-streamed show in which a host eats large quantities of food while interacting with viewers.", kor: "먹방" },
    { no: 14, word: "Chimaek", desc: "Combination of fried chicken and beer enjoyed as a casual meal/snack.", kor: "치맥" },
    { no: 15, word: "Aegyo", desc: "Cute and charming behavior or facial expressions used to show affection.", kor: "애교" },
    { no: 16, word: "Oppa", desc: "Term used by females to address an older brother or older male friend/partner.", kor: "오빠" },
    { no: 17, word: "Unni", desc: "Term used by females to address an older sister or older female friend.", kor: "언니" },
    { no: 18, word: "Hyung", desc: "Term used by males to address an older brother or older male friend.", kor: "형" },
    { no: 19, word: "Noona", desc: "Term used by males to address an older sister or older female friend.", kor: "누나" },
    { no: 20, word: "Daebak", desc: "An exclamation expressing great enthusiasm, excitement, or shock (meaning 'great success').", kor: "대박" },
    { no: 21, word: "Fighting", desc: "An expression of encouragement and support used to wish someone good luck.", kor: "파이팅" },
    { no: 22, word: "K-pop", desc: "Korean popular music incorporating various pop music styles.", kor: "케이팝" },
    { no: 23, word: "Trot", desc: "Traditional genre of Korean popular music known for its distinctive repetitive rhythm and vocal trills.", kor: "트롯" },
    { no: 24, word: "Pansori", desc: "Genre of musical storytelling performed by a singer and a drummer.", kor: "판소리" },
    { no: 25, word: "Samulnori", desc: "Genre of traditional percussion music played on four instruments.", kor: "사물놀이" },
    { no: 26, word: "Samgyeopsal", desc: "Dish of pork belly grilled at the table.", kor: "삼겹살" },
    { no: 27, word: "Mandu", desc: "Korean dumplings filled with minced meat, tofu, and vegetables.", kor: "만두" },
    { no: 28, word: "Samgyetang", desc: "Traditional soup made with a whole young chicken stuffed with ginseng, garlic, and rice.", kor: "삼계탕" },
    { no: 29, word: "Buldak", desc: "Dish of chicken cooked with an extremely spicy sauce.", kor: "불닭" },
    { no: 30, word: "K-barbecue", desc: "Style of cooking and dining where meat is grilled at the table.", kor: "K-바비큐" },
    { no: 31, word: "K-drama", desc: "Television drama series produced in South Korea.", kor: "K-드라마" },
    { no: 32, word: "K-news", desc: "News media and journalism originating from South Korea.", kor: "K-뉴스" },
    { no: 33, word: "K-beauty", desc: "Korean skincare and cosmetics products and beauty techniques.", kor: "K-뷰티" },
    { no: 34, word: "Manhwa", desc: "Korean cartoons, comic books, or webtoons.", kor: "만화" },
    { no: 35, word: "Ondol", desc: "Traditional Korean underfloor heating system.", kor: "온돌" },
    { no: 36, word: "Doenjang", desc: "Traditional Korean fermented soybean paste.", kor: "된장" },
    { no: 37, word: "Gochujang", desc: "Traditional Korean fermented red chili paste.", kor: "고추장" },
    { no: 38, word: "Ssamjang", desc: "Thick, spicy paste used as a dipping sauce for wraps in Korean barbecue.", kor: "쌈장" },
    { no: 39, word: "Gayageum", desc: "Traditional Korean 12-string plucked zither.", kor: "가야금" },
    { no: 40, word: "Geomunggo", desc: "Traditional Korean 6-string plucked zither.", kor: "거문고" },
    { no: 41, word: "Haegeum", desc: "Traditional Korean two-stringed vertical bowed fiddle.", kor: "해금" },
    { no: 42, word: "Makgeolli", desc: "Traditional Korean milky, sweet, and lightly sparkling rice wine.", kor: "막걸리" },
    { no: 43, word: "Soju", desc: "Clear, distilled alcoholic beverage popular in South Korea.", kor: "소주" },
    { no: 44, word: "Anju", desc: "Food or snacks served and consumed with alcoholic drinks.", kor: "안주" }
];

let startTime = null;
let timerInterval = null;
let elapsedTime = 0;

function init() {
    const studyTbody = document.getElementById('study-list');
    const quizDiv = document.getElementById('quiz-list');

    data.forEach((item) => {
        // 학습하기 데이터 생성
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${item.no}</td>
            <td><strong>${item.word}</strong></td>
            <td>${item.desc}</td>
            <td>${item.kor}</td>
        `;
        studyTbody.appendChild(tr);

        // 퀴즈 데이터 생성
        const qBox = document.createElement('div');
        qBox.className = 'quiz-item';
        qBox.innerHTML = `
            <div class="quiz-q">${item.no}. ${item.desc} <span class="quiz-korean">${item.kor}</span></div>
            <input type="text" class="quiz-input" id="q-${item.no}" placeholder="영어 단어를 입력하세요" autocomplete="off">
            <div class="feedback" id="fb-${item.no}"></div>
        `;
        quizDiv.appendChild(qBox);
    });

    // 타이머 시작
    startTimer();
}

function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
        elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        const min = Math.floor(elapsedTime / 60);
        const sec = elapsedTime % 60;
        document.getElementById('timer-display').innerText = `⏱️ 소요 시간: ${min}분 ${sec}초`;
    }, 1000);
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabName === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-study').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-quiz').classList.add('active');
    }
}

function checkAnswers() {
    const cls = document.getElementById('student-class').value.trim();
    const num = document.getElementById('student-num').value.trim();
    const name = document.getElementById('student-name').value.trim();

    if (!cls || !num || !name) {
        alert('학년/반, 번호, 이름을 모두 입력해 주세요!');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
    }

    // 타이머 멈춤
    clearInterval(timerInterval);

    let correctCount = 0;

    data.forEach((item) => {
        const input = document.getElementById(`q-${item.no}`);
        const fb = document.getElementById(`fb-${item.no}`);
        const userAns = input.value.trim().toLowerCase();
        const correctAns = item.word.toLowerCase();

        input.classList.remove('correct', 'wrong');

        if (userAns === correctAns) {
            correctCount++;
            input.classList.add('correct');
            fb.innerText = '정답입니다! ⭕';
            fb.style.color = '#16a34a';
        } else {
            input.classList.add('wrong');
            fb.innerText = `오답입니다. (정답: ${item.word})`;
            fb.style.color = '#dc2626';
        }
    });

    // 점수 산출 (44문항 100점 만점 환산)
    const finalScore = Math.round((correctCount / 44) * 100);
    const min = Math.floor(elapsedTime / 60);
    const sec = elapsedTime % 60;

    // 결과 표시
    document.getElementById('res-student-info').innerText = `${cls} ${num} ${name}`;
    document.getElementById('res-time').innerText = `${min}분 ${sec}초`;
    document.getElementById('res-count').innerText = `${correctCount} / 44 개`;
    document.getElementById('res-score').innerText = `${finalScore}점`;

    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

init();
</script>

</body>
</html>

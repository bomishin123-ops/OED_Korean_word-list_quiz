<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED 우리말 영단어 학습 앱</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --subtext: #6b7280;
            --correct: #10b981;
            --wrong: #ef4444;
            --accent: #8b5cf6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.35rem;
            margin: 0 0 16px 0;
            font-weight: 800;
        }

        /* 시작 화면 */
        .start-screen {
            text-align: center;
            padding: 20px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .input-field {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-light);
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* 탭 상단 메뉴 */
        .tabs {
            display: flex;
            background: #eef2ff;
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--subtext);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 어휘 학습 플래시카드 */
        .flashcard-container {
            perspective: 1000px;
            height: 360px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border: 2px solid #e0e7ff;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            box-sizing: border-box;
            overflow-y: auto;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f8fafc;
            border-color: #c7d2fe;
            justify-content: flex-start;
        }

        .card-english-desc {
            font-size: 1.05rem;
            color: #374151;
            line-height: 1.5;
            font-weight: 600;
            word-break: keep-all;
        }

        .card-word {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 2px;
            margin-top: 4px;
        }

        .card-meaning {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .card-trans {
            font-size: 0.9rem;
            color: #374151;
            line-height: 1.4;
            word-break: keep-all;
            background: #eef2ff;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #c7d2fe;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
        }

        .card-eng-full {
            font-size: 0.88rem;
            color: #4b5563;
            line-height: 1.4;
            word-break: keep-all;
            background: #ffffff;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            width: 100%;
            text-align: left;
            font-style: italic;
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--subtext);
            margin-top: 20px;
            background: #f3f4f6;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .card-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ctrl-btn {
            background: #e0e7ff;
            color: var(--primary);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-indicator {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--subtext);
        }

        /* 어휘 퀴즈 영역 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
            background: #f8fafc;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--wrong);
            color: #991b1b;
        }

        .quiz-explanation {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            line-height: 1.5;
            display: none;
            color: #374151;
        }

        .quiz-explanation strong {
            color: var(--primary);
        }

        .quiz-nav-btn {
            width: 100%;
            margin-top: 16px;
        }

        /* 캡처 결과 화면 */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-card {
            background: #f8fafc;
            border: 2px dashed #a5b4fc;
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            text-align: left;
        }

        .result-item {
            font-size: 1rem;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .result-item:last-child { border-bottom: none; }

        .result-score-highlight {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin: 12px 0;
        }

        .capture-notice {
            font-size: 0.85rem;
            color: var(--wrong);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>옥스포드 사전(OED) 우리말 영단어</h1>

    <!-- 시작 화면 -->
    <div id="start-screen" class="start-screen">
        <p style="color: var(--subtext); font-size: 0.95rem;">학습 및 퀴즈 제출을 위해 학번과 이름을 입력해주세요.</p>
        <div class="input-group">
            <input type="text" id="student-id" class="input-field" placeholder="학번 (예: 20301)" autocomplete="off">
            <input type="text" id="student-name" class="input-field" placeholder="이름 (예: 홍길동)" autocomplete="off">
        </div>
        <button class="primary-btn" onclick="startApp()">학습 시작하기</button>
    </div>

    <!-- 메인 앱 콘텐츠 -->
    <div id="main-app" style="display: none;">
        <!-- 탭 메뉴 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('card')">🃏 어휘 학습</button>
            <button class="tab-btn" onclick="setTab('quiz')">📝 어휘 퀴즈</button>
        </div>

        <!-- 어휘 학습 영역 -->
        <div id="tab-card" class="tab-content active">
            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="card-inner">
                    <!-- 앞면: 영영 풀이 -->
                    <div class="card-face">
                        <div class="card-english-desc" id="card-eng-desc">English Description</div>
                        <div class="card-hint">👆 터치하면 단어와 풀이가 나와요</div>
                    </div>
                    <!-- 뒷면: 단어 + 우리말 뜻 + 우리말 번역 + 영영 풀이 -->
                    <div class="card-face card-back">
                        <div class="card-word" id="card-word">Korean</div>
                        <div class="card-meaning" id="card-meaning">한국어</div>
                        <div class="card-trans" id="card-trans">💡 한국어 번역</div>
                        <div class="card-eng-full" id="card-eng-full">📖 English Description</div>
                    </div>
                </div>
            </div>
            <div class="card-controls">
                <button class="ctrl-btn" onclick="prevCard()">이전</button>
                <span class="card-indicator" id="card-num">1 / 50</span>
                <button class="ctrl-btn" onclick="nextCard()">다음</button>
            </div>
        </div>

        <!-- 어휘 퀴즈 영역 -->
        <div id="tab-quiz" class="tab-content">
            <div class="quiz-header">
                <span id="quiz-num">문제 1 / 50</span>
                <span id="quiz-score">점수: 0</span>
            </div>
            
            <div class="quiz-question" id="quiz-q-text">English Description</div>

            <div class="options" id="quiz-options"></div>

            <!-- 정답 클릭 시 바로 표시되는 해설 영역 -->
            <div class="quiz-explanation" id="quiz-expl"></div>

            <button class="primary-btn quiz-nav-btn" id="quiz-next-btn" style="display: none;" onclick="nextQuiz()">다음 문제</button>
        </div>

        <!-- 결과/캡처 화면 -->
        <div class="result-screen" id="result-screen">
            <h2>🎉 모든 학습 완료!</h2>
            <p class="capture-notice">📸 아래 결과를 캡처하여 제출하세요.</p>

            <div class="result-card">
                <div class="result-item">
                    <span style="color:var(--subtext)">학번</span>
                    <span id="res-id" style="font-weight:bold">-</span>
                </div>
                <div class="result-item">
                    <span style="color:var(--subtext)">이름</span>
                    <span id="res-name" style="font-weight:bold">-</span>
                </div>
                <div class="result-item">
                    <span style="color:var(--subtext)">소요 시간</span>
                    <span id="res-time" style="font-weight:bold">0분 0초</span>
                </div>
                <div class="result-score-highlight" id="res-score">0 / 50</div>
            </div>

            <button class="primary-btn" onclick="restartApp()">다시 학습하기</button>
        </div>
    </div>
</div>

<script>
// 데이터 원문 (총 50개 어휘)
const rawData = [
    { word: "Korean", kor: "한국어", desc: "The language spoken by the people of Korea and written mainly in Hangul.", trans: "한국인들이 사용하며 주로 한글로 표기되는 언어." },
    { word: "gisaeng", kor: "기생", desc: "A female entertainer in traditional Korea who was trained in music, dance, and poetry.", trans: "음악, 무용, 시 등에 수련을 받은 전통 한국의 여성 예인." },
    { word: "Hangul", kor: "한글", desc: "The writing system used to write the Korean language, created during the Joseon Dynasty.", trans: "조선시대에 창제된 한국어를 적는 문자 체계." },
    { word: "kimchi", kor: "김치", desc: "A traditional Korean dish made by fermenting vegetables with red pepper powder and other seasonings.", trans: "채소를 고춧가루 및 기타 양념과 함께 발효시켜 만든 한국의 전통 음식." },
    { word: "myon", kor: "면", desc: "A Korean word meaning noodles, used in the names of many Korean noodle dishes.", trans: "국수를 뜻하는 한국어로, 다양한 국수 요리 이름에 사용됨." },
    { word: "makkoli", kor: "막걸리", desc: "A traditional Korean rice wine with a milky appearance and a slightly sweet taste.", trans: "탁한 빛깔과 약간 단맛이 나는 한국의 전통 쌀막걸리(탁주)." },
    { word: "sijo", kor: "시조", desc: "A traditional Korean poem with a fixed form and rhythm.", trans: "정해진 형식과 운율을 가진 한국의 전통 시가." },
    { word: "taekwondo", kor: "태권도", desc: "A Korean martial art that is famous for its powerful kicking techniques.", trans: "강력한 발차기 기술로 유명한 한국의 무술." },
    { word: "won", kor: "원", desc: "The official unit of money used in South Korea.", trans: "대한민국에서 사용되는 공식 화폐 단위." },
    { word: "yangban", kor: "양반", desc: "A member of the highest social class during the Joseon Dynasty.", trans: "조선시대 최고 사회 계급의 구성원." },
    { word: "ondol", kor: "온돌", desc: "A traditional Korean floor-heating system that keeps rooms warm.", trans: "방을 따뜻하게 유지하는 한국의 전통 바닥 난방 방식." },
    { word: "hapkido", kor: "합기도", desc: "A Korean martial art that uses kicks, punches, throws, and joint-locking techniques.", trans: "발차기, 주먹 지르기, 던지기, 관절 꺾기 기술 등을 사용하는 한국의 무술." },
    { word: "bibimbap", kor: "비빔밥", desc: "A Korean rice dish mixed with vegetables, meat, egg, and gochujang.", trans: "채소, 고기, 계란, 고추장을 밥과 함께 비벼 먹는 한국의 요리." },
    { word: "soju", kor: "소주", desc: "A clear Korean alcoholic drink usually made from rice or other grains.", trans: "주로 쌀이나 다른 곡물로 만드는 투명한 한국의 알코올 음료." },
    { word: "webtoon", kor: "웹툰", desc: "A digital comic designed mainly to be read on smartphones or computers.", trans: "주로 스마트폰이나 컴퓨터로 보도록 제작된 디지털 만화." },
    { word: "K-pop", kor: "케이팝", desc: "Popular music from South Korea, known for its singers, dance performances, and global fans.", trans: "가수, 댄스 퍼포먼스, 전 세계적 팬덤으로 유명한 한국의 대중음악." },
    { word: "gochujang", kor: "고추장", desc: "A thick, spicy Korean paste made mainly from red chili powder, rice, and fermented soybeans.", trans: "주로 고춧가루, 쌀, 메주 등을 이용하여 만든 붉고 매운 걸쭉한 한국의 장." },
    { word: "doenjang", kor: "된장", desc: "A traditional Korean paste made from fermented soybeans and used to season many dishes.", trans: "발효된 콩으로 만들며 다양한 요리의 간을 맞추는 데 쓰이는 한국의 전통 장." },
    { word: "chaebol", kor: "재벌", desc: "A large South Korean business group owned or controlled by one family.", trans: "한 가문이 소유하거나 지배하는 한국의 대기업 집단." },
    { word: "aegyo", kor: "애교", desc: "Cute behavior or a charming way of speaking used to show affection.", trans: "애정을 표현하기 위해 사용하는 귀여운 행동이나 애교 섞인 말투." },
    { word: "banchan", kor: "반찬", desc: "Small side dishes served with rice as part of a Korean meal.", trans: "한국 식사에서 밥과 함께 제공되는 작은 부식들." },
    { word: "bulgogi", kor: "불고기", desc: "A Korean dish of thinly sliced meat that is marinated and then grilled or cooked.", trans: "얇게 썬 고기를 양념에 재운 뒤 굽거나 볶아 먹는 한국 요리." },
    { word: "chimaek", kor: "치맥", desc: "A popular Korean combination of fried chicken and beer.", trans: "프라이드치킨과 맥주를 함께 즐기는 인기 있는 한국의 조합." },
    { word: "daebak", kor: "대박", desc: "A Korean expression used when something is surprising, impressive, or very successful.", trans: "놀랍거나 감명 깊거나 대단히 성공적일 때 사용하는 한국어 표현." },
    { word: "dongchimi", kor: "동치미", desc: "A type of kimchi made with radish in a cool, clear, and lightly seasoned liquid.", trans: "무를 넣어 시원하고 국물이 맑으며 슴슴하게 담근 김치의 한 종류." },
    { word: "fighting", kor: "파이팅", desc: "A Korean expression used to encourage someone and wish them success.", trans: "누군가를 응원하고 성공을 빌어줄 때 사용하는 한국식 응원 표현." },
    { word: "galbi", kor: "갈비", desc: "A Korean dish made from marinated beef or pork ribs, usually grilled.", trans: "양념한 소나 돼지의 갈비뼈 부위로 만들며 주로 구워 먹는 한국 요리." },
    { word: "hallyu", kor: "한류", desc: "The worldwide popularity of South Korean culture, including music, television, film, and food.", trans: "음악, 드라마, 영화, 음식 등을 포함한 한국 대중문화의 전 세계적 열풍." },
    { word: "hanbok", kor: "한복", desc: "Traditional Korean clothing, often worn on holidays, weddings, and other special occasions.", trans: "명절, 결혼식 등 특별한 날에 주로 입는 한국의 전통 의상." },
    { word: "japchae", kor: "잡채", desc: "A Korean dish of glass noodles stir-fried with vegetables and sometimes meat.", trans: "당면을 채소 및 고기와 함께 볶아 만든 한국 요리." },
    { word: "K-", kor: "케이-", desc: "A prefix used to show that something comes from or is connected with Korea.", trans: "어떤 것이 한국에서 유래했거나 한국과 관련되어 있음을 나타내는 접두사." },
    { word: "K-drama", kor: "케이드라마", desc: "A television drama made in South Korea, often watched by audiences around the world.", trans: "전 세계 시청자들이 즐겨보는 한국에서 제작된 TV 드라마." },
    { word: "kimbap", kor: "김밥", desc: "A Korean dish of rice and other ingredients rolled in dried seaweed and cut into pieces.", trans: "밥과 여러 재료를 김으로 말아 썰어 먹는 한국 요리." },

let quizData = [];
let studentId = "";
let studentName = "";
let currentCardIdx = 0;
let currentQuizIdx = 0;
let quizScore = 0;
let selectedOption = null;
let startTime = null;

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function startApp() {
    studentId = document.getElementById('student-id').value.trim();
    studentName = document.getElementById('student-name').value.trim();

    if (!studentId || !studentName) {
        alert("학번과 이름을 모두 입력해주세요!");
        return;
    }

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';

    quizData = shuffle(rawData);

    startTime = Date.now();
    updateCard();
    loadQuiz();
}

function setTab(type) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(cont => cont.classList.remove('active'));

    if (type === 'card') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-card').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-quiz').classList.add('active');
    }
}

/* 어휘 학습 카드 제어 */
function flipCard() {
    document.getElementById('card-inner').classList.toggle('flipped');
}

function updateCard() {
    const cardInner = document.getElementById('card-inner');
    cardInner.classList.remove('flipped');

    setTimeout(() => {
        const item = rawData[currentCardIdx];
        document.getElementById('card-eng-desc').innerText = item.desc;
        document.getElementById('card-word').innerText = item.word;
        document.getElementById('card-meaning').innerText = item.kor;
        document.getElementById('card-trans').innerText = `💡 ${item.trans}`;
        document.getElementById('card-eng-full').innerText = `📖 ${item.desc}`;
        document.getElementById('card-num').innerText = `${currentCardIdx + 1} / ${rawData.length}`;
    }, 150);
}

function nextCard() {
    if (currentCardIdx < rawData.length - 1) {
        currentCardIdx++;
        updateCard();
    }
}

function prevCard() {
    if (currentCardIdx > 0) {
        currentCardIdx--;
        updateCard();
    }
}

/* 어휘 퀴즈 제어 */
function loadQuiz() {
    const item = quizData[currentQuizIdx];
    selectedOption = null;

    document.getElementById('quiz-num').innerText = `문제 ${currentQuizIdx + 1} / ${quizData.length}`;
    document.getElementById('quiz-score').innerText = `점수: ${quizScore}`;
    document.getElementById('quiz-q-text').innerText = item.desc;

    let choices = [{ word: item.word, kor: item.kor }];
    while (choices.length < 4) {
        let randItem = rawData[Math.floor(Math.random() * rawData.length)];
        if (!choices.some(c => c.word === randItem.word)) {
            choices.push({ word: randItem.word, kor: randItem.kor });
        }
    }
    choices = shuffle(choices);

    const optionsDiv = document.getElementById('quiz-options');
    optionsDiv.innerHTML = '';
    choices.forEach((choiceObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}) ${choiceObj.word} (${choiceObj.kor})`;
        btn.onclick = () => selectQuizOption(choiceObj.word, btn);
        optionsDiv.appendChild(btn);
    });

    document.getElementById('quiz-expl').style.display = 'none';
    document.getElementById('quiz-next-btn').style.display = 'none';
}

function selectQuizOption(choiceWord, btnElem) {
    if (selectedOption !== null) return;

    const item = quizData[currentQuizIdx];
    selectedOption = choiceWord;

    const allBtns = document.querySelectorAll('#quiz-options .option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (choiceWord === item.word) {
        btnElem.classList.add('correct');
        quizScore++;
        document.getElementById('quiz-score').innerText = `점수: ${quizScore}`;
    } else {
        btnElem.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.innerText.includes(`${item.word} (`)) {
                b.classList.add('correct');
            }
        });
    }

    const explBox = document.getElementById('quiz-expl');
    explBox.innerHTML = `
        <strong>💡 정답: ${item.word} (${item.kor})</strong><br>
        📖 <strong>해설 번역:</strong> ${item.trans}
    `;
    explBox.style.display = 'block';

    document.getElementById('quiz-next-btn').style.display = 'block';
}

function nextQuiz() {
    currentQuizIdx++;
    if (currentQuizIdx < quizData.length) {
        loadQuiz();
    } else {
        showResult();
    }
}

/* 최종 결과 */
function showResult() {
    document.querySelectorAll('.tabs, .tab-content').forEach(e => e.style.display = 'none');
    document.getElementById('result-screen').style.display = 'block';

    const totalSec = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;

    document.getElementById('res-id').innerText = studentId;
    document.getElementById('res-name').innerText = studentName;
    document.getElementById('res-time').innerText = `${min}분 ${sec}초`;
    document.getElementById('res-score').innerText = `${quizScore} / ${quizData.length} 점`;
}

function restartApp() {
    currentCardIdx = 0;
    currentQuizIdx = 0;
    quizScore = 0;
    
    document.getElementById('result-screen').style.display = 'none';
    document.querySelectorAll('.tabs').forEach(e => e.style.display = 'flex');
    setTab('card');
    startApp();
}
</script>
